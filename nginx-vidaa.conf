# Serves the packaged VIDAA build AND the Magis proxy on the same origin, so a
# TV needs a single URL and the proxy call is same-origin (no CORS involved).
# The shell is a single-page app that loads hashed bundles: only the entry
# points must never be cached, because a stale index.html is what makes a TV
# keep running an old bundle.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Magis portal calls, forwarded to the proxy app.
  location /magis/ {
    proxy_pass http://172.17.0.1:7300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
  }

  # Entry points and the service worker must be revalidated on every launch.
  location ~* "^/(index\.html|vidaa\.html|sw\.js|nuvio\.env\.js)$" {
    add_header Cache-Control "no-store" always;
  }

  # Hashed bundles never change under the same name.
  location ~* "\.[0-9a-f]+\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;
}
