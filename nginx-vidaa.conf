# Serves the packaged VIDAA build. The shell is a single-page app that loads
# hashed bundles, so only the entry points must never be cached: a stale
# index.html is what makes a TV keep running an old bundle.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The TV never sends this host anywhere else, so the shell is the default.
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Entry points and the service worker must be revalidated on every launch.
  location ~* ^/(index\.html|vidaa\.html|sw\.js|nuvio\.env\.js)$ {
    add_header Cache-Control "no-store" always;
  }

  # Hashed bundles never change under the same name.
  location ~* \.[0-9a-f]{16}\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;
}
